name: fastapi-canciones

services: 
  fastapi-app:  
    build:  
      context: .  
      dockerfile: Dockerfile  
    container_name: fastapi-app-canciones 
    restart: always  
    ports:  
      - "8000:8000"  
    depends_on:  
      - fastapi-db  
  fastapi-db:  
    image: postgres:latest
    container_name: fastapi-db-canciones
    environment:  
      POSTGRES_ROOT_PASSWORD: quevedo
      POSTGRES_DB: cancionesdb
      POSTGRES_USER: quevedo
      POSTGRES_PASSWORD: 1234
    ports:  
      - "5432:5432"  
  