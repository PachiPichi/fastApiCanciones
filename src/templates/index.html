{% extends "fragments/base.html" %}
{% block title %}Página index{% endblock %}

{% block content %}
<div class="container py-5">

    <div class="text-center mb-4">
        <h1 class="fw-bold">
            <i class="bi bi-music-note-beamed"></i>
            Web de Canciones
        </h1>
        <p class="text-muted">Aplicación de gestión de canciones
        </p>
    </div>

    <div class="row justify-content-center">
        <div class="col-md-6">

            <div class="card shadow-sm">
                <div class="card-body d-grid gap-3">

                    <a href="{{ url_for('static', path='static.html') }}"
                       class="btn btn-outline-secondary">
                        <i class="bi bi-file-earmark-text"></i>
                        Contenido estático
                    </a>

                    <a href="{{ url_for('ver_canciones') }}"
                       class="btn btn-primary">
                        <i class="bi bi-list-ul"></i>
                        Ver lista de canciones
                    </a>

                    <a href="/canciones/new"
                       class="btn btn-success">
                        <i class="bi bi-plus-circle"></i>
                        Crear canción
                    </a>

                </div>
            </div>

        </div>
    </div>

</div>
{% endblock %}

{% block footer %}
<div class="text-center py-3 text-muted">
    <small>FOOTER desde Index</small>
</div>
{% endblock %}
